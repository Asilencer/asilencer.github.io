title: 我的博客
description: 一个基于 Jekyll 的现代风格个人博客
url: ""
baseurl: ""
timezone: Asia/Shanghai
lang: zh-CN

author:
  name: Your Name
  email: your-email@example.com
  github: your-username

theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Your Name"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
