<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Pi 从 Agent 消息到厂商协议的请求链路</title>
  <desc id="desc">Pi 把 Agent 消息转换成统一 Context，经 Provider 选择协议适配器，解析厂商流为统一事件，再由 Agent 执行工具并回到下一轮。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #fbfaf2; }
      .title { font: 700 32px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17212b; }
      .subtitle { font: 400 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #59636e; }
      .lane { fill: #f5f2e8; stroke: #ded9ca; stroke-width: 1.5; rx: 18; }
      .laneName { font: 700 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #59636e; }
      .box { fill: #ffffff; stroke: #d8d3c4; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .blue { fill: #eef5ff; stroke: #7aa7e8; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .green { fill: #ecfdf3; stroke: #70bd86; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .amber { fill: #fff8df; stroke: #d3a844; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .head { font: 700 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17212b; text-anchor: middle; }
      .body { font: 400 13px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #59636e; text-anchor: middle; }
      .arrow { stroke: #52606d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #8a6d23; stroke-width: 3; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .adapterText { font: 600 14px "SFMono-Regular", Consolas, monospace; fill: #17212b; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="58" y="58">Pi：在内部语义与厂商线协议之间建立适配边界</text>
  <text class="subtitle" x="58" y="91">上层只处理 Message、ToolCall 和事件；边缘适配器负责每家 API 的 JSON、SSE、签名与停止原因。</text>

  <rect class="lane" x="45" y="125" width="1310" height="150"/>
  <text class="laneName" x="68" y="155">Agent 上下文层</text>

  <rect class="lane" x="45" y="300" width="1310" height="190"/>
  <text class="laneName" x="68" y="330">路由与协议层</text>

  <rect class="lane" x="45" y="515" width="1310" height="180"/>
  <text class="laneName" x="68" y="545">厂商流与工具闭环</text>

  <path class="arrow" d="M 280 210 L 330 210"/>
  <path class="arrow" d="M 535 210 L 585 210"/>
  <path class="arrow" d="M 790 210 L 840 210"/>
  <path class="arrow" d="M 1045 210 C 1100 210, 1100 355, 1145 355"/>
  <path class="arrow" d="M 1145 405 L 1080 405"/>
  <path class="arrow" d="M 975 455 C 975 510, 952 520, 952 560"/>
  <path class="arrow" d="M 865 600 L 815 600"/>
  <path class="arrow" d="M 640 600 L 590 600"/>
  <path class="arrow" d="M 415 600 L 365 600"/>
  <path class="loop" d="M 190 600 C 85 600, 85 265, 190 265 L 790 265 C 820 265, 835 245, 840 225"/>

  <g transform="translate(95 170)">
    <rect class="box" width="185" height="80"/>
    <text class="head" x="92.5" y="34">AgentMessage[]</text>
    <text class="body" x="92.5" y="58">用户、Shell、摘要、自定义消息</text>
  </g>

  <g transform="translate(330 170)">
    <rect class="box" width="205" height="80"/>
    <text class="head" x="102.5" y="34">transformContext()</text>
    <text class="body" x="102.5" y="58">裁剪、压缩、业务变换</text>
  </g>

  <g transform="translate(585 170)">
    <rect class="box" width="205" height="80"/>
    <text class="head" x="102.5" y="34">convertToLlm()</text>
    <text class="body" x="102.5" y="58">转成 pi-ai Message</text>
  </g>

  <g transform="translate(840 170)">
    <rect class="blue" width="205" height="80"/>
    <text class="head" x="102.5" y="34">Context</text>
    <text class="body" x="102.5" y="58">systemPrompt / messages / tools</text>
  </g>

  <g transform="translate(1145 345)">
    <rect class="green" width="175" height="120"/>
    <text class="head" x="87.5" y="38">Models / Provider</text>
    <text class="body" x="87.5" y="68">鉴权、Base URL</text>
    <text class="body" x="87.5" y="91">按 model.api 路由</text>
  </g>

  <g transform="translate(120 350)">
    <rect class="amber" width="960" height="105"/>
    <line x1="240" y1="18" x2="240" y2="87" stroke="#d3a844" stroke-width="1.5"/>
    <line x1="480" y1="18" x2="480" y2="87" stroke="#d3a844" stroke-width="1.5"/>
    <line x1="720" y1="18" x2="720" y2="87" stroke="#d3a844" stroke-width="1.5"/>
    <text class="adapterText" x="120" y="34">openai-responses</text>
    <text class="body" x="120" y="66">input / output items</text>
    <text class="body" x="120" y="86">类型化事件</text>
    <text class="adapterText" x="360" y="34">openai-completions</text>
    <text class="body" x="360" y="66">messages / choices.delta</text>
    <text class="body" x="360" y="86">兼容能力矩阵</text>
    <text class="adapterText" x="600" y="34">anthropic-messages</text>
    <text class="body" x="600" y="66">content block 生命周期</text>
    <text class="body" x="600" y="86">thinking / tool_use</text>
    <text class="adapterText" x="840" y="34">google-generative-ai</text>
    <text class="body" x="840" y="66">contents / parts</text>
    <text class="body" x="840" y="86">thoughtSignature</text>
  </g>

  <g transform="translate(865 560)">
    <rect class="box" width="175" height="80"/>
    <text class="head" x="87.5" y="32">厂商 SSE / Stream</text>
    <text class="body" x="87.5" y="56">原始增量与 usage</text>
  </g>

  <g transform="translate(640 560)">
    <rect class="blue" width="175" height="80"/>
    <text class="head" x="87.5" y="32">统一事件流</text>
    <text class="body" x="87.5" y="56">text / thinking / toolcall</text>
  </g>

  <g transform="translate(415 560)">
    <rect class="green" width="175" height="80"/>
    <text class="head" x="87.5" y="32">Agent 工具循环</text>
    <text class="body" x="87.5" y="56">验证、授权、执行</text>
  </g>

  <g transform="translate(190 560)">
    <rect class="box" width="175" height="80"/>
    <text class="head" x="87.5" y="32">ToolResultMessage</text>
    <text class="body" x="87.5" y="56">结果、错误、调用 ID</text>
  </g>

  <text class="subtitle" x="510" y="736">工具结果回到 Context，适配器按目标协议编码，进入下一轮</text>
</svg>
