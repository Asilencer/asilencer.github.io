<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">大模型工具调用闭环</title>
  <desc id="desc">应用定义工具，模型生成调用，应用验证并执行，回传结果，模型继续推理或给出答案。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #fbfaf2; }
      .title { font: 700 32px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17212b; }
      .subtitle { font: 400 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #59636e; }
      .box { fill: #ffffff; stroke: #d8d3c4; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .boxBlue { fill: #eef5ff; stroke: #7aa7e8; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .boxGreen { fill: #ecfdf3; stroke: #70bd86; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .num { fill: #17212b; }
      .numText { font: 700 17px "PingFang SC", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .head { font: 700 19px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17212b; text-anchor: middle; }
      .body { font: 400 14px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #59636e; text-anchor: middle; }
      .arrow { stroke: #52606d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .band { fill: #17212b; rx: 14; }
      .bandText { font: 500 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="520"/>
  <text class="title" x="64" y="61">工具调用是由应用闭环的多轮协议</text>
  <text class="subtitle" x="64" y="94">模型只生成结构化调用意图；参数验证、权限、执行和结果回传都属于应用责任。</text>

  <path class="arrow" d="M 265 225 L 315 225"/>
  <path class="arrow" d="M 505 225 L 555 225"/>
  <path class="arrow" d="M 745 225 L 795 225"/>
  <path class="arrow" d="M 985 225 L 1035 225"/>
  <path class="arrow" d="M 1130 316 C 1130 410, 160 410, 160 316"/>

  <g transform="translate(75 145)">
    <rect class="box" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">1</text>
    <text class="head" x="95" y="74">定义工具</text>
    <text class="body" x="95" y="105">名称、描述</text>
    <text class="body" x="95" y="128">JSON Schema</text>
  </g>

  <g transform="translate(315 145)">
    <rect class="boxBlue" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">2</text>
    <text class="head" x="95" y="74">模型提出调用</text>
    <text class="body" x="95" y="105">调用 ID、工具名</text>
    <text class="body" x="95" y="128">参数可能分片到达</text>
  </g>

  <g transform="translate(555 145)">
    <rect class="boxGreen" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">3</text>
    <text class="head" x="95" y="74">验证并执行</text>
    <text class="body" x="95" y="105">解析、Schema 校验</text>
    <text class="body" x="95" y="128">权限检查、错误处理</text>
  </g>

  <g transform="translate(795 145)">
    <rect class="box" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">4</text>
    <text class="head" x="95" y="74">关联结果</text>
    <text class="body" x="95" y="105">用原调用 ID 回传</text>
    <text class="body" x="95" y="128">保留成功或失败状态</text>
  </g>

  <g transform="translate(1035 145)">
    <rect class="boxBlue" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">5</text>
    <text class="head" x="95" y="74">模型继续</text>
    <text class="body" x="95" y="105">给出最终答案</text>
    <text class="body" x="95" y="128">或发起下一次调用</text>
  </g>

  <rect class="band" x="210" y="442" width="860" height="46"/>
  <text class="bandText" x="640" y="465">字段名不同，语义相同：tool_calls / function_call / tool_use / functionCall</text>
</svg>
