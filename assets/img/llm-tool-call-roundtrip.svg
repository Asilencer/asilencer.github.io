<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">大模型工具调用闭环</title>
  <desc id="desc">应用定义工具，模型生成调用，应用验证并执行，回传结果，模型继续推理或给出答案。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#403e3c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d14d41"/>
    </marker>
    <filter id="hardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#e6e4d9"/>
    </filter>
    <style>
      .bg { fill: #fffcf0; }
      .title,
      .subtitle,
      .numText,
      .head,
      .body,
      .bandText {
        font-family: "Hannotate SC", "HannotateSC-W5", "手札体-简", "HanziPen SC", cursive;
      }
      .title { font-size: 32px; font-weight: 700; fill: #100f0f; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #403e3c; }
      .box { fill: #fffcf0; stroke: #100f0f; stroke-width: 1.5; rx: 3; filter: url(#hardShadow); }
      .modelBox { fill: #fffcf0; stroke: #d14d41; stroke-width: 2; rx: 3; filter: url(#hardShadow); }
      .actionBox { fill: #f2f0e5; stroke: #100f0f; stroke-width: 1.5; rx: 3; filter: url(#hardShadow); }
      .num { fill: #d14d41; stroke: #100f0f; stroke-width: 1; }
      .numText { font-size: 17px; font-weight: 700; fill: #fffcf0; text-anchor: middle; dominant-baseline: middle; }
      .head { font-size: 19px; font-weight: 700; fill: #100f0f; text-anchor: middle; }
      .body { font-size: 14px; font-weight: 400; fill: #6f6e69; text-anchor: middle; }
      .arrow { stroke: #403e3c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #d14d41; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowRed); }
      .band { fill: #100f0f; stroke: #100f0f; stroke-width: 1.5; rx: 3; filter: url(#hardShadow); }
      .bandText { font-size: 17px; font-weight: 500; fill: #fffcf0; text-anchor: middle; dominant-baseline: middle; }
      .bandCode {
        font-family: "ComicShannsMono Nerd Font", "ComicShannsMono Nerd Font Mono", "ComicShannsMono NF",
          "Hannotate SC", "HannotateSC-W5", "手札体-简", "HanziPen SC", ui-monospace,
          "SFMono-Regular", Menlo, Consolas, monospace;
        fill: #fffcf0;
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="520"/>
  <rect x="64" y="31" width="4" height="34" rx="2" fill="#d14d41"/>
  <text class="title" x="82" y="61">工具调用是由应用闭环的多轮协议</text>
  <text class="subtitle" x="82" y="94">模型只生成结构化调用意图；参数验证、权限、执行和结果回传都属于应用责任。</text>

  <path class="arrow" d="M 265 225 L 315 225"/>
  <path class="arrow" d="M 505 225 L 555 225"/>
  <path class="arrow" d="M 745 225 L 795 225"/>
  <path class="arrow" d="M 985 225 L 1035 225"/>
  <path class="loop" d="M 1130 316 C 1130 410, 160 410, 160 316"/>

  <g transform="translate(75 145)">
    <rect class="box" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">1</text>
    <text class="head" x="95" y="74">定义工具</text>
    <text class="body" x="95" y="105">名称、描述</text>
    <text class="body" x="95" y="128">JSON Schema</text>
  </g>

  <g transform="translate(315 145)">
    <rect class="modelBox" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">2</text>
    <text class="head" x="95" y="74">模型提出调用</text>
    <text class="body" x="95" y="105">调用 ID、工具名</text>
    <text class="body" x="95" y="128">参数可能分片到达</text>
  </g>

  <g transform="translate(555 145)">
    <rect class="actionBox" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">3</text>
    <text class="head" x="95" y="74">验证并执行</text>
    <text class="body" x="95" y="105">解析、Schema 校验</text>
    <text class="body" x="95" y="128">权限检查、错误处理</text>
  </g>

  <g transform="translate(795 145)">
    <rect class="box" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">4</text>
    <text class="head" x="95" y="74">关联结果</text>
    <text class="body" x="95" y="105">用原调用 ID 回传</text>
    <text class="body" x="95" y="128">保留成功或失败状态</text>
  </g>

  <g transform="translate(1035 145)">
    <rect class="modelBox" width="190" height="170"/>
    <circle class="num" cx="30" cy="30" r="18"/>
    <text class="numText" x="30" y="30">5</text>
    <text class="head" x="95" y="74">模型继续</text>
    <text class="body" x="95" y="105">给出最终答案</text>
    <text class="body" x="95" y="128">或发起下一次调用</text>
  </g>

  <rect class="band" x="210" y="442" width="860" height="46"/>
  <text class="bandText" x="640" y="465">
    <tspan>字段名不同，语义相同：</tspan>
    <tspan class="bandCode">tool_calls / function_call / tool_use / functionCall</tspan>
  </text>
</svg>
