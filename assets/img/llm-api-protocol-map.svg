<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">主流模型厂商与 API 协议的多对多关系</title>
  <desc id="desc">OpenAI、Anthropic、Google、DeepSeek、GLM、Kimi 和 Qwen 分别提供一种或多种原生及兼容协议。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #fbfaf2; }
      .title { font: 700 34px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #59636e; }
      .card { fill: #ffffff; stroke: #d8d3c4; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .vendor { font: 700 24px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17212b; }
      .note { font: 400 15px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #66717c; }
      .pillText { font: 600 16px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17212b; text-anchor: middle; dominant-baseline: middle; }
      .native { fill: #dbeafe; stroke: #7aa7e8; stroke-width: 1.5; rx: 14; }
      .compat { fill: #dcfce7; stroke: #70bd86; stroke-width: 1.5; rx: 14; }
      .own { fill: #fef3c7; stroke: #d3a844; stroke-width: 1.5; rx: 14; }
      .legend { font: 500 15px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #4b5563; dominant-baseline: middle; }
      .conclusion { fill: #17212b; rx: 16; }
      .conclusionText { font: 600 20px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="860"/>
  <text class="title" x="70" y="68">厂商不是协议：二者是多对多关系</text>
  <text class="subtitle" x="70" y="102">蓝色表示厂商原生协议，绿色表示兼容协议，黄色表示平台自有协议。</text>

  <g transform="translate(70 125)">
    <rect class="native" width="22" height="22"/>
    <text class="legend" x="32" y="11">原生协议</text>
    <rect class="compat" x="135" width="22" height="22"/>
    <text class="legend" x="167" y="11">兼容协议</text>
    <rect class="own" x="270" width="22" height="22"/>
    <text class="legend" x="302" y="11">平台自有协议</text>
  </g>

  <g transform="translate(70 180)">
    <rect class="card" width="350" height="245"/>
    <text class="vendor" x="28" y="46">OpenAI</text>
    <text class="note" x="28" y="75">一家厂商，两套主要生成接口</text>
    <rect class="native" x="28" y="100" width="294" height="48"/>
    <text class="pillText" x="175" y="124">Responses API</text>
    <rect class="native" x="28" y="165" width="294" height="48"/>
    <text class="pillText" x="175" y="189">Chat Completions</text>
  </g>

  <g transform="translate(465 180)">
    <rect class="card" width="350" height="245"/>
    <text class="vendor" x="28" y="46">Anthropic</text>
    <text class="note" x="28" y="75">内容块与命名 SSE 事件</text>
    <rect class="native" x="28" y="112" width="294" height="58"/>
    <text class="pillText" x="175" y="141">Messages API</text>
  </g>

  <g transform="translate(860 180)">
    <rect class="card" width="350" height="245"/>
    <text class="vendor" x="28" y="46">Google</text>
    <text class="note" x="28" y="75">Content / Part 数据模型</text>
    <rect class="native" x="28" y="112" width="294" height="58"/>
    <text class="pillText" x="175" y="141">Gemini GenerateContent</text>
  </g>

  <g transform="translate(70 465)">
    <rect class="card" width="255" height="250"/>
    <text class="vendor" x="24" y="44">DeepSeek</text>
    <text class="note" x="24" y="73">兼容入口加思考扩展</text>
    <rect class="compat" x="24" y="98" width="207" height="46"/>
    <text class="pillText" x="127.5" y="121">OpenAI Chat</text>
    <rect class="compat" x="24" y="160" width="207" height="46"/>
    <text class="pillText" x="127.5" y="183">Anthropic Messages</text>
  </g>

  <g transform="translate(365 465)">
    <rect class="card" width="255" height="250"/>
    <text class="vendor" x="24" y="44">智谱 GLM</text>
    <text class="note" x="24" y="73">交错与保留式思考</text>
    <rect class="compat" x="24" y="116" width="207" height="54"/>
    <text class="pillText" x="127.5" y="143">OpenAI Chat</text>
  </g>

  <g transform="translate(660 465)">
    <rect class="card" width="255" height="250"/>
    <text class="vendor" x="24" y="44">Kimi / Moonshot</text>
    <text class="note" x="24" y="73">入口不同，协议不同</text>
    <rect class="compat" x="24" y="98" width="207" height="46"/>
    <text class="pillText" x="127.5" y="121">OpenAI Chat</text>
    <rect class="compat" x="24" y="160" width="207" height="46"/>
    <text class="pillText" x="127.5" y="183">Coding: Messages</text>
  </g>

  <g transform="translate(955 465)">
    <rect class="card" width="255" height="250"/>
    <text class="vendor" x="24" y="44">通义千问</text>
    <text class="note" x="24" y="73">同时提供四种接口</text>
    <rect class="compat" x="24" y="92" width="96" height="42"/>
    <text class="pillText" x="72" y="113">Chat</text>
    <rect class="compat" x="135" y="92" width="96" height="42"/>
    <text class="pillText" x="183" y="113">Responses</text>
    <rect class="compat" x="24" y="150" width="207" height="42"/>
    <text class="pillText" x="127.5" y="171">Anthropic Messages</text>
    <rect class="own" x="24" y="208" width="207" height="42"/>
    <text class="pillText" x="127.5" y="229">DashScope</text>
  </g>

  <rect class="conclusion" x="205" y="770" width="870" height="56"/>
  <text class="conclusionText" x="640" y="798">判断接入方式时，应先确认具体端点实现了哪套协议，再看厂商和模型名称</text>
</svg>
