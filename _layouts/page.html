---
layout: default
---
<div class="container-wide page-shell">
  <article class="page">
    {% if page.title and page.title != "" %}
    <header class="page-header">
      <p class="eyebrow"><span></span> PAGE / {{ page.title | upcase }}</p>
      <h1>{{ page.title }}</h1>
    </header>
    {% endif %}
    <div class="page-content">
      {{ content }}
    </div>
  </article>
</div>
