---
layout: default
---
<div class="container">
  <article class="page">
    {% if page.title and page.title != "" %}
    <header class="page-header">
      <h1>{{ page.title }}</h1>
    </header>
    {% endif %}
    <div class="page-content" {% if page.title == "" %}style="margin-top: 2rem;"{% endif %}>
      {{ content }}
    </div>
  </article>
</div>
