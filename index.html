<section class="hero">
  <canvas id="particles-canvas"></canvas>
  <div class="hero-content container">
    <div class="profile-card">
      <div class="profile-card-glow"></div>
      <div class="profile-avatar-ring">
        <div class="profile-avatar">{{ site.author.avatar }}</div>
      </div>
      <h1 class="profile-name">{{ site.author.name }}</h1>
      <p class="profile-role">{{ site.author.role }}</p>
      <p class="profile-bio">{{ site.description }}</p>
      <div class="profile-stats">
        <div class="stat-item">
          <span class="stat-num">{{ site.posts.size }}</span>
          <span class="stat-label">文章</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">{% assign cats = site.categories | size %}{{ cats }}</span>
          <span class="stat-label">分类</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">{% assign tag_count = site.tags | size %}{{ tag_count }}</span>
          <span class="stat-label">标签</span>
        </div>
      </div>
      <div class="profile-links">
        <a href="{{ site.author.github | prepend: 'https://github.com/' }}" target="_blank" class="profile-link">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
        <a href="/categories.html" class="profile-link">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
          分类
        </a>
        <a href="/about.html" class="profile-link">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          关于
        </a>
      </div>
    </div>
  </div>
</section>
